<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AutoDesk">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>AutoDesk — Myyntipäivä</title>
<style>
:root{color-scheme:light;--bg:#f5f5f7;--card:#fff;--ink:#171719;--muted:#77777d;--line:#e6e6e8;--blue:#087cff;--green:#22a447;--orange:#e98500;--red:#e83a32;--shadow:0 7px 25px #0000000a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}main{max-width:1100px;margin:auto;padding:22px 18px calc(95px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;margin:0 2px 20px}.date{font-size:13px;color:var(--muted);font-weight:600;text-transform:capitalize}h1{font-size:32px;letter-spacing:-1.2px;margin:3px 0}.primary{background:var(--ink);color:white;border:0;border-radius:14px;padding:12px 16px;font-weight:650}.hero,.card,.kpi{background:var(--card);border-radius:22px;box-shadow:var(--shadow)}.hero{padding:20px;margin-bottom:14px}.hero-top{display:flex;justify-content:space-between;gap:12px}.hero h2{font-size:19px;margin:0 0 4px}.hero p{color:var(--muted);font-size:14px;margin:0}.score{font-size:26px;font-weight:750}.bar{height:8px;background:#e9e9eb;border-radius:99px;overflow:hidden;margin-top:15px}.fill{height:100%;width:0;background:var(--ink);transition:width .2s}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.kpi{padding:15px}.num{font-size:24px;font-weight:750}.label{font-size:12px;color:var(--muted);margin-top:3px}.columns{display:grid;grid-template-columns:1.4fr .8fr;gap:14px}.card{padding:18px;margin-bottom:14px}.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.title{font-weight:750;font-size:18px}.link{border:0;background:none;color:var(--blue);font-weight:600;padding:8px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.tab{white-space:nowrap;background:#f1f1f3;border:0;border-radius:11px;padding:8px 11px}.tab.active{background:var(--ink);color:#fff}.row{display:grid;grid-template-columns:10px 1fr auto;gap:11px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.dot{height:9px;width:9px;border-radius:50%;background:var(--blue)}.dot.hot{background:var(--red)}.dot.warm{background:var(--orange)}.name{font-size:14px;font-weight:650;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);margin-top:3px}.right{text-align:right}.status{font-size:12px;font-weight:650}.status.hot{color:var(--red)}.status.test{color:var(--blue)}.status.offer{color:var(--green)}.remove{border:0;background:none;color:#999;font-size:20px;padding:3px 5px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick button{border:1px solid var(--line);background:#fafafa;border-radius:14px;text-align:left;padding:12px}.quick b{display:block;font-size:13px}.quick span{font-size:11px;color:var(--muted)}.task{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.check{width:22px;height:22px;border-radius:50%;border:1.5px solid #aaa;background:#fff;flex:none;position:relative}.task.done .check{background:var(--ink);border-color:var(--ink)}.task.done .check:after{content:'✓';color:white;position:absolute;left:4px;top:-1px}.task.done .name{text-decoration:line-through;color:var(--muted)}.taskbody{flex:1;min-width:0}.empty{padding:13px 0;color:var(--muted);font-size:14px}.modal{position:fixed;z-index:5;inset:0;background:#0005;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal.open{display:flex}.sheet{width:min(560px,100%);background:white;border-radius:25px;padding:21px;max-height:92dvh;overflow:auto;padding-bottom:calc(21px + env(safe-area-inset-bottom))}.sheet h2{font-size:21px;margin:0 0 15px}.sheet label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.sheet input,.sheet select{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:#f8f8f9;margin-bottom:12px;outline:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:9px}.actions button{flex:1;border:0;border-radius:13px;padding:13px;font-weight:650}.cancel{background:#eee}.save{background:var(--ink);color:white}.bottomnav{display:none}.toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:11px 15px;border-radius:13px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:760px){main{padding:18px 13px calc(88px + env(safe-area-inset-bottom))}h1{font-size:29px}.columns{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.card{padding:16px}.desktop-add{display:none}.bottomnav{position:fixed;z-index:4;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#fffffff2;backdrop-filter:blur(18px);border-top:1px solid #ddd;padding:9px 5px calc(9px + env(safe-area-inset-bottom))}.bottomnav button{border:0;background:none;color:#666;display:grid;justify-items:center;gap:3px;font-size:10px;padding:3px 9px}.bottomnav button strong{font-size:19px;font-weight:500}.bottomnav button.active{color:var(--blue)}}
</style>
</head>
<body>
<main>
<header><div><div class="date" id="date"></div><h1>Myyntipäivä</h1></div><button class="primary desktop-add" onclick="openTask()">＋ Tehtävä</button></header>
<section class="hero"><div class="hero-top"><div><h2>Päivän tilanne</h2><p id="heroText">Pidä tärkeimmät asiakkaat liikkeessä.</p></div><div class="score" id="score">0%</div></div><div class="bar"><div class="fill" id="fill"></div></div></section>
<section class="kpis"><div class="kpi"><div class="num" id="kLeads">0</div><div class="label">Aktiivista liidiä</div></div><div class="kpi"><div class="num" id="kFollow">0</div><div class="label">Follow-up</div></div><div class="kpi"><div class="num" id="kTest">0</div><div class="label">Koeajoa</div></div><div class="kpi"><div class="num" id="kDelivery">0</div><div class="label">Toimitusta</div></div></section>
<div class="columns"><div><section class="card"><div class="cardhead"><div class="title">Asiakkaat</div><button class="link" onclick="openLead()">＋ Uusi</button></div><div class="tabs"><button class="tab active" data-filter="all">Kaikki</button><button class="tab" data-filter="hot">Kuumat</button><button class="tab" data-filter="follow">Follow-up</button><button class="tab" data-filter="test">Koeajot</button></div><div id="leads"></div></section><section class="card"><div class="cardhead"><div class="title">Tehtävät</div><button class="link" onclick="openTask()">＋ Lisää</button></div><div id="tasks"></div></section></div><aside><section class="card"><div class="title" style="margin-bottom:12px">Pikatoiminnot</div><div class="quick"><button onclick="openLead('hot')"><b>🔥 Uusi liidi</b><span>Potentiaalinen ostaja</span></button><button onclick="openLead('follow')"><b>📞 Follow-up</b><span>Ota yhteyttä</span></button><button onclick="openLead('test')"><b>🚗 Koeajo</b><span>Varaa asiakkaalle</span></button><button onclick="openTask('delivery')"><b>🔑 Toimitus</b><span>Valmistele luovutus</span></button></div></section><section class="card"><div class="title" style="margin-bottom:8px">Myyntiputki</div><div class="row"><i class="dot hot"></i><div class="name">Kuumat</div><b id="pipeHot">0</b></div><div class="row"><i class="dot warm"></i><div class="name">Tarjoukset</div><b id="pipeOffer">0</b></div><div class="row"><i class="dot"></i><div class="name">Uudet</div><b id="pipeNew">0</b></div></section></aside></div>
</main>
<nav class="bottomnav"><button class="active" onclick="window.scrollTo({top:0,behavior:'smooth'})"><strong>⌂</strong>Tänään</button><button onclick="openLead()"><strong>＋</strong>Asiakas</button><button onclick="openTask()"><strong>✓</strong>Tehtävä</button></nav>
<div class="modal" id="taskModal"><div class="sheet"><h2>Uusi myyntitehtävä</h2><label>Tehtävä</label><input id="tn" placeholder="Esim. Soita BMW 530d -asiakkaalle"><div class="grid2"><div><label>Kategoria</label><select id="tc"><option>Follow-up</option><option>Liidit</option><option>Koeajo</option><option>Tarjous</option><option>Toimitus</option><option>Autot</option><option>Muu</option></select></div><div><label>Klo</label><input id="tt" type="time"></div></div><div class="actions"><button class="cancel" onclick="closeModals()">Peruuta</button><button class="save" onclick="addTask()">Lisää tehtävä</button></div></div></div>
<div class="modal" id="leadModal"><div class="sheet"><h2>Uusi asiakas</h2><label>Asiakkaan nimi</label><input id="ln" placeholder="Nimi"><div class="grid2"><div><label>Auto / kiinnostus</label><input id="lcar" placeholder="BMW 530d"></div><div><label>Puhelin</label><input id="lphone" type="tel" placeholder="040..."></div></div><div class="grid2"><div><label>Tila</label><select id="ls"><option value="hot">🔥 Kuuma</option><option value="follow">📞 Follow-up</option><option value="test">🚗 Koeajo</option><option value="offer">💬 Tarjous</option><option value="new">Uusi</option></select></div><div><label>Aika</label><input id="lt" type="time"></div></div><div class="actions"><button class="cancel" onclick="closeModals()">Peruuta</button><button class="save" onclick="addLead()">Lisää asiakas</button></div></div></div><div id="toast" class="toast" role="status"></div>
<script>
const tn=document.getElementById('tn'),tc=document.getElementById('tc'),tt=document.getElementById('tt'),ln=document.getElementById('ln'),lcar=document.getElementById('lcar'),lphone=document.getElementById('lphone'),ls=document.getElementById('ls'),lt=document.getElementById('lt'),taskModal=document.getElementById('taskModal'),leadModal=document.getElementById('leadModal'),score=document.getElementById('score'),fill=document.getElementById('fill'),kLeads=document.getElementById('kLeads'),kFollow=document.getElementById('kFollow'),kTest=document.getElementById('kTest'),kDelivery=document.getElementById('kDelivery'),pipeHot=document.getElementById('pipeHot'),pipeOffer=document.getElementById('pipeOffer'),pipeNew=document.getElementById('pipeNew'),heroText=document.getElementById('heroText');
const TKEY='autodesk_tasks_v2',LKEY='autodesk_leads_v2';let tasks=load(TKEY),leads=load(LKEY),leadFilter='all';function load(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return []}}function save(){try{localStorage.setItem(TKEY,JSON.stringify(tasks));localStorage.setItem(LKEY,JSON.stringify(leads))}catch{toast('Tallennus ei onnistunut tässä selaimessa.')}}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function statusName(s){return{hot:'Kuuma',follow:'Follow-up',test:'Koeajo',offer:'Tarjous',new:'Uusi'}[s]||s}function openTask(type){document.getElementById('taskModal').classList.add('open');if(type==='delivery'){tn.value='Valmistele auton toimitus';tc.value='Toimitus'}setTimeout(()=>tn.focus(),80)}function openLead(type){document.getElementById('leadModal').classList.add('open');if(type)ls.value=type;setTimeout(()=>ln.focus(),80)}function closeModals(){document.querySelectorAll('.modal').forEach(x=>x.classList.remove('open'))}document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModals()}));function addTask(){let n=tn.value.trim();if(!n){tn.focus();return}tasks.push({name:n,cat:tc.value,time:tt.value,done:false});save();render();closeModals();tn.value='';tt.value=''}function addLead(){let n=ln.value.trim();if(!n){ln.focus();return}leads.push({name:n,car:lcar.value.trim(),phone:lphone.value.trim(),status:ls.value,time:lt.value});save();render();closeModals();['ln','lcar','lphone','lt'].forEach(id=>document.getElementById(id).value='')}function toggleTask(i){tasks[i].done=!tasks[i].done;save();render()}function removeTask(i){tasks.splice(i,1);save();render()}function removeLead(i){leads.splice(i,1);save();render()}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{leadFilter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderLeads()}));function renderLeads(){let a=leads.map((x,i)=>({...x,i})).filter(x=>leadFilter==='all'||x.status===leadFilter);document.getElementById('leads').innerHTML=a.length?a.map(x=>`<div class="row"><i class="dot ${x.status==='hot'?'hot':x.status==='new'?'':'warm'}"></i><div><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.car||'Ei autoa')}${x.phone?' · '+esc(x.phone):''}</div></div><div class="right"><div class="status ${x.status}">${statusName(x.status)}</div><div class="meta">${esc(x.time)}</div><button class="remove" aria-label="Poista asiakas" onclick="removeLead(${x.i})">×</button></div></div>`).join(''):'<div class="empty">Ei asiakkaita tässä näkymässä.</div>'}function renderTasks(){document.getElementById('tasks').innerHTML=tasks.length?tasks.map((x,i)=>`<div class="task ${x.done?'done':''}"><button class="check" aria-label="Merkitse tehdyksi" onclick="toggleTask(${i})"></button><div class="taskbody"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.cat)}${x.time?' · '+x.time:''}</div></div><button class="remove" aria-label="Poista tehtävä" onclick="removeTask(${i})">×</button></div>`).join(''):'<div class="empty">Ei tehtäviä. Lisää ensimmäinen tehtävä.</div>'}function render(){let d=new Date();document.getElementById('date').textContent=d.toLocaleDateString('fi-FI',{weekday:'long',day:'numeric',month:'long'});renderTasks();renderLeads();let total=tasks.length,done=tasks.filter(x=>x.done).length,p=total?Math.round(done/total*100):0;score.textContent=p+'%';fill.style.width=p+'%';kLeads.textContent=leads.length;kFollow.textContent=leads.filter(x=>x.status==='follow').length;kTest.textContent=leads.filter(x=>x.status==='test').length;kDelivery.textContent=tasks.filter(x=>x.cat==='Toimitus'&&!x.done).length;pipeHot.textContent=leads.filter(x=>x.status==='hot').length;pipeOffer.textContent=leads.filter(x=>x.status==='offer').length;pipeNew.textContent=leads.filter(x=>x.status==='new').length;heroText.textContent=done===total&&total?'Hienoa — päivän tehtävät ovat valmiit.':'Pidä tärkeimmät asiakkaat liikkeessä.'}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModals();if(e.key==='Enter'){if(taskModal.classList.contains('open'))addTask();else if(leadModal.classList.contains('open'))addLead()}});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
